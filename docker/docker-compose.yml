services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: feishu_pm_backend
    container_name: feishu_pm_backend
    volumes:
      - backend_data:/data
    env_file:
      - .env
    environment:
      # 基础设施开关：让定时任务调度器启动并注册"周会自动开启/催更"任务。
      # 放在 compose(随 git 管理)而非 .env，确保所有部署(含外网)都生效，无需手改服务器 .env。
      # 注意：这只是让调度器跑起来；是否真正发消息仍受 DB 运行时开关 + FEISHU_NOTIFY_ENABLED 控制。
      AUTO_OPEN_MEETING_ENABLED: "True"
      # 飞书真实外发总开关：开启后周会催更/纪要/自动开周会通知会真正发到飞书群。
      # 同样放 compose 以便外网无需改 .env；如需停止真实外发改成 "False" 即可。
      FEISHU_NOTIFY_ENABLED: "True"
      # 留言讨论区独立库 + 媒体目录放持久卷 /data（否则落容器临时盘，每次重建即丢数据）。
      # 放 compose 确保所有部署生效，无需手改服务器 .env。
      DISCUSS_DATABASE_URL: "sqlite:////data/discuss.db"
      DISCUSS_UPLOAD_DIR: "/data/discuss_uploads"
    restart: unless-stopped
    networks:
      - feishu_pm_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 营销销售部实例：复用同一镜像，独立数据卷 + 独立 .env.sales（不同 SECRET_KEY/飞书/品牌）
  backend-sales:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: feishu_pm_backend
    container_name: feishu_pm_backend_sales
    volumes:
      - sales_data:/data
    env_file:
      - .env.sales
    environment:
      AUTO_OPEN_MEETING_ENABLED: "True"
      FEISHU_NOTIFY_ENABLED: "True"
      DISCUSS_DATABASE_URL: "sqlite:////data/discuss.db"
      DISCUSS_UPLOAD_DIR: "/data/discuss_uploads"
    restart: unless-stopped
    networks:
      - feishu_pm_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # 部署时用 `WEB_BUILD_REF=$(git rev-parse --short HEAD) docker compose build frontend` 注入真实提交号。
        # 用独立变量名（非 APP_VERSION）避免与 .env 里的后端产品版本号 1.0.0 冲突。
        APP_VERSION: ${WEB_BUILD_REF:-dev}
    image: feishu_pm_frontend
    container_name: feishu_pm_frontend
    ports:
      - "8088:80"
    volumes:
      # 各实例品牌图片（logo/favicon）：放服务器对应目录，Nginx 按子域名 /branding/ 提供
      - ./branding/pms:/srv/branding/pms:ro
      - ./branding/sales:/srv/branding/sales:ro
    depends_on:
      backend:
        condition: service_healthy
      backend-sales:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - feishu_pm_network

volumes:
  backend_data:
  sales_data:

networks:
  feishu_pm_network:
    driver: bridge

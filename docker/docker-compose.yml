services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: feishu_pm_backend
    container_name: feishu_pm_backend
    volumes:
      - backend_data:/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - feishu_pm_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: feishu_pm_frontend
    container_name: feishu_pm_frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - feishu_pm_network

volumes:
  backend_data:

networks:
  feishu_pm_network:
    driver: bridge

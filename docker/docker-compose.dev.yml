# 开发模式：挂载源码，后端开启 --reload。
# 用法：docker compose -f docker-compose.dev.yml up --build
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: feishu_pm_backend
    container_name: feishu_pm_backend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      # 挂载源码到 /app/backend 以支持热重载（与镜像内代码位置一致）
      - ../backend:/app/backend
      - backend_data:/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - feishu_pm_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: feishu_pm_frontend
    container_name: feishu_pm_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - feishu_pm_network

volumes:
  backend_data:

networks:
  feishu_pm_network:
    driver: bridge

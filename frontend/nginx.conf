# ============================================================
# 多实例反向代理（同主域子域名分流）
# - pms.youdoogo.com（默认，含本地 localhost）→ 产品后端 backend:8000
# - sales.youdoogo.com                        → 营销后端 backend-sales:8000
# 两者共用同一份前端 dist；品牌差异化由各自后端 /api/v1/branding 返回。
# 生产 TLS 建议在更外层（反代/负载均衡）终止；本文件按 80 端口分流。
# ============================================================

# ---- 产品方（默认 server，未匹配的域名 / 本地访问都走这里）----
server {
    listen 80 default_server;
    server_name pms.youdoogo.com localhost _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 品牌图片（产品方通常用内置默认 logo，可空目录）
    location /branding/ {
        alias /srv/branding/pms/;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- 营销销售部（独立后端 + 独立品牌图片，共用同一份 dist）----
server {
    listen 80;
    server_name sales.youdoogo.com;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 营销品牌图片：服务器 ./branding/sales/ 下的 logo/favicon
    location /branding/ {
        alias /srv/branding/sales/;
    }

    location /api {
        proxy_pass http://backend-sales:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

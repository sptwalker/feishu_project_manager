# ============================================================
# 多实例反向代理（同主域子域名分流）
# - pms.youdoogo.com（默认，含本地 localhost）→ 产品后端 backend:8000
# - sales.youdoogo.com                        → 营销后端 backend-sales:8000
# 两者共用同一份前端 dist；品牌差异化由各自后端 /api/v1/branding 返回。
# 生产 TLS 建议在更外层（反代/负载均衡）终止；本文件按 80 端口分流。
# ============================================================

# ---- 产品方（默认 server，未匹配的域名 / 本地访问都走这里）----
server {
    listen 80 default_server;
    server_name pms.youdoogo.com localhost _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 品牌图片（产品方通常用内置默认 logo，可空目录）
    location /branding/ {
        alias /srv/branding/pms/;
    }

    # 上传图片/视频：Nginx 直接 sendfile 提供（零拷贝、带 Content-Length、无临时文件缓冲），
    # 不再穿透后端单进程 uvicorn —— 解决图片显示慢 & 高并发时上传被事件循环饿死导致「保存失败」。
    # 文件不存在（老数据未落盘 / 刚上传）时回退 @backend 由后端处理。
    location /api/v1/uploads/ {
        alias /srv/uploads/pms/uploads/;
        try_files $uri @backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location @backend {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传 POST 也落到这里（文件还不存在）：放大请求体上限，否则大图/视频 413
        client_max_body_size 110m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 留言区上传视频需放大请求体上限（后端限 100MB）；默认仅 1MB 会拦下视频/大图
        client_max_body_size 110m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- 营销销售部（独立后端 + 独立品牌图片，共用同一份 dist）----
server {
    listen 80;
    server_name sales.youdoogo.com;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 营销品牌图片：服务器 ./branding/sales/ 下的 logo/favicon
    location /branding/ {
        alias /srv/branding/sales/;
    }

    # 上传图片/视频：Nginx 直接 sendfile 提供，不穿透后端（同产品方，指向营销卷）
    location /api/v1/uploads/ {
        alias /srv/uploads/sales/uploads/;
        try_files $uri @backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location @backend {
        proxy_pass http://backend-sales:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传 POST 也落到这里（文件还不存在）：放大请求体上限，否则大图/视频 413
        client_max_body_size 110m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api {
        proxy_pass http://backend-sales:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 留言区上传视频需放大请求体上限（后端限 100MB）；默认仅 1MB 会拦下视频/大图
        client_max_body_size 110m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
